name: AWS CI/CD Pipeline

# Triggers CI/CD on Pull Requests targeting the 'aws' branch and direct merges to 'aws'.
# Pushes to 'dev' branch are strictly ignored.
on:
  pull_request:
    branches:
      - aws
  push:
    branches:
      - aws
  workflow_dispatch:

jobs:
  # -----------------------------------------------------
  # Job 1: Backend CI (Python / FastAPI Syntax & Tests)
  # -----------------------------------------------------
  backend-ci:
    name: Backend CI (FastAPI & Hermes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sara_backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sara_backend/requirements.txt
          pip install flake8

      - name: Verify Python syntax
        run: |
          python -m py_compile $(find sara_backend/app -name "*.py")
          python -m py_compile sara_backend/run_server.py

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 sara_backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

  # -----------------------------------------------------
  # Job 2: Android App CI (Kotlin & Jetpack Compose)
  # -----------------------------------------------------
  android-ci:
    name: Android App CI (Gradle Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # -----------------------------------------------------
  # Job 3: AWS CD (Deploy Backend to AWS EC2 Instance)
  # -----------------------------------------------------
  aws-cd:
    name: AWS EC2 CD (Deploy Backend)
    runs-on: ubuntu-latest
    needs: [backend-ci]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying JARVIS-Hermes backend on AWS EC2 ==="
            APP_DIR="/home/ubuntu/sara_hermes"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository for the first time..."
              git clone -b aws https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              echo "Pulling latest changes from aws branch..."
              cd "$APP_DIR"
              git fetch origin
              git checkout aws
              git pull origin aws
            fi
            
            echo "Syncing backend files to /opt/jarvis/app..."
            sudo mkdir -p /opt/jarvis/app
            sudo cp -rf "$APP_DIR/sara_backend/"* /opt/jarvis/app/
            sudo chown -R jarvis:jarvis /opt/jarvis
            
            echo "Running AWS setup / dependency updates..."
            sudo bash /opt/jarvis/app/deploy/aws_setup.sh
            
            echo "Restarting JARVIS backend service..."
            sudo systemctl restart jarvis-api
            sudo systemctl status jarvis-api --no-pager
            echo "=== Deployment Complete! ==="
